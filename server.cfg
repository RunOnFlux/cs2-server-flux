// server.cfg for Counter-Strike 2 on Flux. Run once when the server starts. Edit it in your panel's
// file manager: cfg/server.cfg on the data volume.
//
// Most settings belong in the panel's Server Settings tab instead (cfg/flux/settings.cfg), which
// runs after each game mode's own rules: a round time or a bot count set here would be overwritten
// by the mode as each map starts. The server name, passwords, players and map are Deployment
// Settings, on the command line.
sv_hibernate_when_empty 1
sv_allow_lobby_connect_only 0
log on
